name = "ares-relay"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Only this agent's calls are relayed. scripts/setup-relay.mjs fills it in from ELEVENLABS_AGENT_ID in the .env;
# fill it in yourself before a plain `npx wrangler deploy`.
[vars]
AGENT_ID = ""

# Holds only the phone's push token(s) and, for 7 days, ids of calls already notified.
# Create it with:  npx wrangler kv namespace create ARES_KV   then paste the id here.
[[kv_namespaces]]
binding = "ARES_KV"
id = "b401e8951acb49458a483c163f5e0eab"
