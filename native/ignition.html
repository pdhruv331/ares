<!DOCTYPE html>
<html lang="en" class="look-reactor">
<head>
  <meta charset="UTF-8" />
  <title>ARES Ignition</title>
  <style>
    /* The ignition helper's page (native/AresIgnition.swift): transparent over the offline still. Only the reactor's disc and the title
       band are painted opaquely (the sheet, clipped), so the desktop icons stay visible everywhere else; the wake opens the clip. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: transparent; user-select: none; cursor: default; }
    #sheet, #matrix { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; clip-path: var(--clip, none); transition: opacity 0.6s ease; }
    .core { position: absolute; inset: 0; }
    #hud { position: absolute; inset: 0; width: 100%; height: 100%; }
    #stars, #brain { display: none; }
    body.out { opacity: 0; transition: opacity 0.6s ease; }
    .ghost-log { position: absolute; left: 28px; bottom: 26px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
    .ghost-row { font: 400 10px/1.4 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.08em; color: rgba(250, 196, 88, 0.5); white-space: pre; transition: opacity 0.7s ease; text-shadow: 0 0 6px rgba(250, 196, 88, 0.2); }
    .ghost-row.pulse { animation: ghost-pulse 1.1s ease-in-out infinite; }
    .ghost-row.fail { color: rgba(255, 181, 71, 0.8); }
    .ghost-row.fade { opacity: 0; }
    body.awake .ghost-row { color: rgba(207, 239, 255, 0.42); text-shadow: 0 0 6px rgba(62, 230, 255, 0.15); }
    @keyframes ghost-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="sheet" aria-hidden="true"></canvas>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <section class="core">
    <canvas id="brain"></canvas>
    <canvas id="hud"></canvas>
  </section>
  <div id="ghostLog" class="ghost-log" aria-hidden="true"></div>
  <script src="perf.js"></script>
  <script src="neural.js"></script>
  <script src="reactor.js"></script>
  <script src="ignite.js"></script>
  <script src="scene-boot.js"></script>
  <script src="scene.js"></script>
  <script src="ignition.js"></script>
</body>
</html>
