<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
<!-- ARES's 3D brain inside the Android app (the same brain3d.mjs as the Mac, bundled with the app, offline).
     The app drives it (state, voice level, job orbs); a tapped orb navigates to /open/<id>, which the app catches. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
  .core { position: absolute; inset: 0; }
  #brain, #hud { position: absolute; inset: 0; width: 100%; height: 100%; }
  .orb-tip { display: none; }
</style>
</head>
<body>
  <div class="core"><canvas id="brain"></canvas><canvas id="hud"></canvas></div>
  <script src="renderer/neural.js"></script>
  <script type="module" src="renderer/brain3d.mjs"></script>
  <script>
    // The app → the brain
    window.ares = {
      state(s) { HUD.setState(s); },
      level(v) { HUD.setLevel(v); },
      jobs(list) { window.__jobs = list; window.JobOrbs?.sync(list); },
      land() { window.JobOrbs?.land(null); }, // back from a job: its orb drifts home
      motion(reduce) { window.__reduce = reduce; if (window.JobOrbs) window.JobOrbs.reduceMotion = reduce; },
    };
    addEventListener('orbs-ready', () => {
      if (window.__jobs) JobOrbs.sync(window.__jobs);
      JobOrbs.reduceMotion = Boolean(window.__reduce);
    });
    // The brain → the app: a tapped orb opens its job; a tap anywhere else is a tap on ARES (stop talking)
    // Like the Mac: the orb leaves its orbit and flies at you with a spark burst, then the job opens
    addEventListener('orb-open', async (e) => {
      const id = e.detail;
      await Promise.race([window.JobOrbs.launch(id), new Promise((r) => setTimeout(r, 450))]);
      location.href = '/open/' + encodeURIComponent(id);
    });
    addEventListener('click', (e) => {
      if (window.JobOrbs?.pick(e.clientX, e.clientY, 30)) return;
      location.href = '/tap';
    });
  </script>
</body>
</html>
